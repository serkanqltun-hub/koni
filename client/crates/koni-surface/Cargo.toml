[package]
name = "koni-surface"
description = "KONİ video surface: platform-neutral layout math + Win32 child HWND embedding for libmpv"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

# 0.62 matches the `windows` version used by Tauri 2.12 (tao, wry, webview2-com).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
]

[dev-dependencies]
serde_json = "1"

# macOS: NSOpenGLView + libmpv render API (macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
koni-player = { path = "../koni-player" }
