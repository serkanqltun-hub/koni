[package]
name = "koni"
description = "KONİ masaüstü istemcisi (Faz 0 kokpit spike)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "koni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
koni-player = { path = "../crates/koni-player" }
koni-resolver = { path = "../resolver" }
koni-surface = { path = "../crates/koni-surface" }
koni-sync = { path = "../crates/koni-sync" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
# Profil fotoğrafı arayüze data: adresiyle gider.
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Hesap oturum belirteci: Windows Credential Manager / macOS Keychain.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-updater = "2"
# Lounge relay'i (relay.rs), addon'lar ve Real-Debrid (addons.rs, debrid.rs): güncelleyicinin
# zaten derlediği istemci ve TLS.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-deep-link = "2"

# Masaüstünde ikinci örnek açılırsa linki ilk örneğe iletir.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Yakalayıcı reklam engeli (adblock.rs): Tauri'nin kullandığı sürümlerle aynı olmalı.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Win32_UI_Input_KeyboardAndMouse: "TV'ye yansıt" düğmesi Windows'un Yayınla panelini açar.
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }
