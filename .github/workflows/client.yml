name: client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      # src-tauri is not built here (needs webkit2gtk); Windows job covers it.
      - run: cargo fmt --all -- --check
      - run: cargo test -p koni-player -p koni-surface
      - run: cargo clippy -p koni-player -p koni-surface --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: client
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - run: npm ci
      - run: npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Dev-only libmpv (shinchiro build, may be GPL). Distribution will switch to
      # the LGPL artifact from workflow 'libmpv (LGPL, Windows x64)' (separate PR).
      - name: Fetch libmpv
        run: |
          $dll = ./scripts/fetch-libmpv.ps1 -Out "$env:RUNNER_TEMP/libmpv"
          "LIBMPV_DLL=$dll" >> $env:GITHUB_ENV

      - name: FFI smoke test
        run: cargo run -p koni-player --example smoke -- --lib "$env:LIBMPV_DLL"

      # Release derlemesi uzun sürer ve clippy/test zaten derliyor; dağıtılabilir
      # exe yalnızca elle (workflow_dispatch) istenince. Sürüm paketi release.yml'de.
      - name: Build app (no bundle)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build --no-bundle

      - name: Collect artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/koni.exe out/
          Copy-Item "$env:LIBMPV_DLL" out/libmpv-2.dll

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: koni-win64-dev
          path: client/out/*
          retention-days: 7
          if-no-files-found: error
