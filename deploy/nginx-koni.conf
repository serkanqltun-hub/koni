# /etc/nginx/sites-available/koni  (then: ln -s ../sites-available/koni /etc/nginx/sites-enabled/)
# koni.example.com is a placeholder: install.sh replaces it with $DOMAIN.
# Separate from every other site on this host.
# Certificate: Let's Encrypt via webroot (certbot certonly --webroot -w /var/www/koni-acme -d koni.example.com).
# Clients connect to: wss://koni.example.com/ws

server {
    listen 80;
    listen [::]:80;
    server_name koni.example.com;
    location /.well-known/acme-challenge/ { root /var/www/koni-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name koni.example.com;
    ssl_certificate /etc/letsencrypt/live/koni.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koni.example.com/privkey.pem;
    server_tokens off;

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8080; }

    location /avatars/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # İsteğe bağlı sağlayıcı API aktarımı (yalnızca küçük JSON çağrıları; video buradan geçmez).
    # Yalnızca KONİ hesabı olanlar: X-Koni-Token oturumu koni-server'da (/auth) doğrulanır.
    location /api/rd/ {
        auth_request /_koni_auth;
        proxy_set_header X-Koni-Token "";
        proxy_pass https://api.real-debrid.com/rest/1.0/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.real-debrid.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 64k;
    }

    location = /_koni_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Koni-Token $http_x_koni_token;
    }

    # Sunucu dosya yüklemesi kabul etmez; istek gövdesi küçük tutulur.
    client_max_body_size 1k;
    location / { return 404; }
}
